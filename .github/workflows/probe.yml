name: Probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -s https://repo1.maven.org/maven2/com/google/mediapipe/tasks-vision/maven-metadata.xml | grep -o "<latest>[^<]*\|<release>[^<]*" || echo central-none
          curl -s https://dl.google.com/dl/android/maven2/com/google/mediapipe/tasks-vision/maven-metadata.xml | grep -o "<latest>[^<]*\|<release>[^<]*" || true
          for m in efficientdet_lite0/int8/1/efficientdet_lite0.tflite efficientdet_lite0/float16/1/efficientdet_lite0.tflite efficientdet_lite2/int8/1/efficientdet_lite2.tflite efficientdet_lite2/float16/latest/efficientdet_lite2.tflite; do
            curl -sSLf -o m.tflite https://storage.googleapis.com/mediapipe-models/object_detector/$m && echo "$m $(stat -c%s m.tflite) $(sha256sum m.tflite | cut -c1-64)" || echo "$m missing"
          done
