name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE="$GITHUB_WORKSPACE/signing/release.jks"
          export KS_PASS="$(cat signing/ks_pass)"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk camera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: camera-apk
          path: camera.apk
      - name: Publish the app on the apk branch
        run: |
          mkdir out && cp camera.apk out/ && cd out
          echo "${{ github.run_number }} ${{ github.sha }}" > version.txt
          git init -q -b apk
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add . && git commit -qm "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
