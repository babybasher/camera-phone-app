name: Build app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE="$GITHUB_WORKSPACE/signing/release.jks"
          export KS_PASS="$(cat signing/ks_pass)"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk camera.apk
      - uses: actions/upload-artifact@v4
        with:
          name: camera-apk
          path: camera.apk
